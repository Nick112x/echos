  #c{position:fixed;inset:0;display:block}

    font-weight:400}

const qtext = document.getElementById('qtext');
const qauthor = document.getElementById('qauthor');
const quoteWrap = document.getElementById('quote');

let qIndex = Math.floor(Math.random() * QUOTES.length);
qtext.textContent = QUOTES[qIndex];

function cycleQuote() {
  quoteWrap.classList.add('fade');
  setTimeout(() => {
    qIndex = (qIndex + 1) % QUOTES.length;
    qtext.textContent = QUOTES[qIndex];
    quoteWrap.classList.remove('fade');
  }, 720);
}

// rotate every 7 seconds so the page feels alive on its own
setInterval(cycleQuote, 7000);

// clicking also advances the quote
addEventListener('pointerdown', cycleQuote);

/* ---------- particle field ---------- */
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio || 1, 2);
function resize() {
  W = innerWidth; H = innerHeight;
  c.width = W * DPR; c.height = H * DPR;
  c.style.width = W + 'px'; c.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

let mx = W / 2, my = H / 2, tmx = mx, tmy = my;
const N = 260;
const parts = [];
for (let i = 0; i < N; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 40 + Math.random() * Math.max(W, H) * 0.6;
  parts.push({
    a, baseR: r,
    ox: Math.cos(a) * r, oy: Math.sin(a) * r,
    x: 0, y: 0, vx: 0, vy: 0,
    size: 0.4 + Math.random() * 1.4,
    speed: 0.0006 + Math.random() * 0.0014,
  });
}

addEventListener('mousemove', e => { tmx = e.clientX; tmy = e.clientY; });
addEventListener('touchmove', e => {
  if (e.touches[0]) { tmx = e.touches[0].clientX; tmy = e.touches[0].clientY; }
}, { passive: true });

function loop(t) {
  mx += (tmx - mx) * 0.06;
  my += (tmy - my) * 0.06;

  ctx.fillStyle = 'rgba(5,5,8,0.30)';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;

  for (const p of parts) {
    p.a += p.speed;
    const bx = cx + Math.cos(p.a) * p.baseR;
    const by = cy + Math.sin(p.a) * p.baseR * 0.78;

    const dx = mx - bx, dy = my - by;
    const dm = Math.hypot(dx, dy) || 1;
    const strength = Math.max(0, 1 - dm / 360);
    const gx = (dx / dm) * strength * 28;
    const gy = (dy / dm) * strength * 28;

    const tx = bx + gx;
    const ty = by + gy;

    p.vx += (tx - p.x) * 0.06;
    p.vy += (ty - p.y) * 0.06;
    p.vx *= 0.9; p.vy *= 0.9;
    p.x += p.vx; p.y += p.vy;

    const alpha = 0.25 + strength * 0.6;
    ctx.fillStyle = 'rgba(238,240,247,' + alpha + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size + strength * 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  const g = ctx.createRadialGradient(mx, my, 0, mx, my, 220);
  g.addColorStop(0, 'rgba(138,107,255,0.08)');
  g.addColorStop(1, 'rgba(138,107,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(mx, my, 220, 0, Math.PI * 2); ctx.fill();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
